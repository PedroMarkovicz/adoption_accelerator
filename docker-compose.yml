version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
